id = "tunaflsh/battery-widget"
name = "Battery Widget"
version = "1.0.0"
plugin_api = 26
author = "tunaflsh"
license = "MIT"
icon = "battery"
description = "Battery bar widget with a stable rate/time estimate and real battery health derived from SMBIOS design capacity."
tags = [ "bar", "hardware", "system", "utility", "indicator" ]

# Plugin-level settings are shared by the sampler service and the bar widget.

[[setting]]
key = "device"
type = "string"
label_key = "settings.device.label"
description_key = "settings.device.description"
default = "auto"

[[setting]]
key = "design_capacity_mwh"
type = "int"
label_key = "settings.design_capacity_mwh.label"
description_key = "settings.design_capacity_mwh.description"
default = 0
min = 0
max = 200000
step = 1

[[setting]]
key = "auto_detect_design"
type = "bool"
label_key = "settings.auto_detect_design.label"
description_key = "settings.auto_detect_design.description"
default = false
advanced = true

[[setting]]
key = "smoothing_window_min"
type = "int"
label_key = "settings.smoothing_window_min.label"
description_key = "settings.smoothing_window_min.description"
default = 20
min = 10
max = 60
step = 5
advanced = true

[[widget]]
id = "battery"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle control-center power"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = true

  [[widget.setting]]
  key = "label_content"
  type = "select"
  label_key = "settings.label_content.label"
  description_key = "settings.label_content.description"
  default = "percent"
  options = [
    { value = "percent", label_key = "settings.label_content.percent" },
    { value = "time", label_key = "settings.label_content.time" },
    { value = "rate", label_key = "settings.label_content.rate" },
  ]

  [[widget.setting]]
  key = "hide_when_plugged"
  type = "bool"
  label_key = "settings.hide_when_plugged.label"
  description_key = "settings.hide_when_plugged.description"
  default = false

  [[widget.setting]]
  key = "hide_when_full"
  type = "bool"
  label_key = "settings.hide_when_full.label"
  description_key = "settings.hide_when_full.description"
  default = false

  [[widget.setting]]
  key = "show_health"
  type = "bool"
  label_key = "settings.show_health.label"
  description_key = "settings.show_health.description"
  default = true

  [[widget.setting]]
  key = "warning_color"
  type = "color"
  label_key = "settings.warning_color.label"
  description_key = "settings.warning_color.description"
  default = "error"
  advanced = true

[[service]]
id = "sampler"
entry = "service.luau"
